name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src scripts

      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=json

      - name: Per-package coverage gates
        run: uv run python scripts/check_coverage.py coverage.json pyproject.toml
