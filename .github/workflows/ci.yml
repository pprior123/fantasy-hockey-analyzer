name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags for this action
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src scripts

      - name: Pytest with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=json

      - name: Per-package coverage gates
        run: uv run python scripts/check_coverage.py coverage.json pyproject.toml

  firestore-emulator:
    # The storage tests again, with the Repository contract run against the
    # Firestore emulator (loopback only; no credentials, no cloud project).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags for this action
        with:
          enable-cache: true

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      - name: Install
        run: uv sync --locked

      - name: Storage tests against the emulator
        env:
          FHA_REQUIRE_EMULATOR: "1"  # a missing emulator fails instead of skipping
        run: >-
          npx --yes firebase-tools@15.31.0 emulators:exec --only firestore --project demo-fha
          "uv run pytest tests/unit/storage -q"
