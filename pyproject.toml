[project]
name = "fantasy-hockey-analyzer"
version = "0.1.0"
description = "Private roster analyzer for one Yahoo NHL fantasy team (TTLTST rating vs. AAV)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-auth>=2.58.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fha"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.1",
    "mutmut>=3.8.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-openpyxl>=3.1.5.20260827",
    "uvicorn>=0.54.0",
]

# ---------------------------------------------------------------- vercel
# Every request goes to the function, static files too. Today nothing would be
# promoted anyway (the app has top-level middleware, and the exported app is the
# lazy wrapper, fha.web.main.LazyApp, with no mounts to find at build time); this
# pins it, so a later change can't move files to the CDN, past the middleware.
[tool.vercel.fastapi.static]
cdn = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "N",       # pep8-naming
  "UP",      # pyupgrade
  "B",       # bugbear
  "SIM",     # simplify
  "RUF",     # ruff-specific
  "S",       # bandit
  "PT",      # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "scripts"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Network is blocked by tests/conftest.py (CLAUDE.md hard rule 2); the
# pytest-socket plugin itself is disabled so it can't be used to opt out.
# See tests/network_policy.py.
addopts = [
  "--strict-markers",
  "--strict-config",
  "-p", "no:socket",
]
xfail_strict = true
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["fha"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.fha]
# No `# pragma: no cover` escapes where mutation testing and the 95% gate apply.
coverage-no-exclusions = ["domain"]

# Per-package gates (SPEC §9), enforced by scripts/check_coverage.py.
[tool.fha.coverage-gates]
_root = 90  # modules directly under src/fha/
domain = 95
sources = 90
storage = 90
services = 90
web = 80

# ---------------------------------------------------------------- mutmut
[tool.mutmut]
source_paths = ["src/fha/domain/"]
# mutmut copies only source_paths into mutants/; the rest of the package and
# the scripts the tests import must come along or collection fails.
also_copy = [
  "src/fha/__init__.py",
  "src/fha/py.typed",
  "src/fha/data/",
  "src/fha/sources/",
  "src/fha/storage/",
  "src/fha/services/",
  "src/fha/web/",
  "scripts/",
]
