{% extends "base.html" %}
{% block content %}
<div class="card">
  {% if message %}<p class="error">{{ message }}</p>
  {% else %}<p class="error">The app hit an unexpected error. Try again, or check the server log.</p>{% endif %}
  {% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
</div>
{% endblock %}
